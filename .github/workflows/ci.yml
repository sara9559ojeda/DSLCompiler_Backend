name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Lint, typecheck, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: gRPC contracts — generated code matches the .proto files
        run: npm run proto:check

      - name: Typecheck (builds packages/shared + services/compiler first)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

  # Builds every Dockerfile and brings the backend stack up with
  # docker-compose (Postgres included) — nothing here is mocked. Only runs
  # once `test` passes, so a broken lint/typecheck/unit-test never wastes a
  # Docker build. The frontend's own e2e suite (Playwright against this
  # gateway) lives in its own repo now — see docs/adr/0010-split-frontend-repo.md.
  e2e:
    name: Build Docker images + smoke test the composed stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create the docker-compose .env
        run: cp .env.example .env

      - name: Build all service images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d
        env:
          # Optional: set an ANTHROPIC_API_KEY repo secret to also exercise
          # /api/ai/* for real. The smoke test doesn't depend on it either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for the gateway to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "Gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway never became healthy" >&2
          docker compose logs
          exit 1

      - name: Smoke test /api/compile through the gateway
        run: |
          curl -sf -X POST http://localhost:4000/api/compile             -H "content-type: application/json"             -d '{"source":"c1 = crear_circulo(radio=50, color=rojo, x=10, y=10);"}'             | grep -q '"success":true'

      - name: Smoke test the gRPC hop (gateway → compiler over gRPC)
        run: |
          docker compose logs compiler | grep -q "gRPC listening"
          curl -sf -X POST http://localhost:4000/api/compile/stages             -H "content-type: application/json"             -d '{"source":"c1 = crear_circulo(radio=50, x=10, y=10);"}'             | grep -q '"timings"'
          curl -sf -X POST http://localhost:4000/api/export             -H "content-type: application/json"             -d '{"source":"c1 = crear_circulo(radio=50, x=10, y=10);","format":"png"}'             -o out.png
          head -c 4 out.png | grep -q PNG

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
