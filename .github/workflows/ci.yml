name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Lint, typecheck, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (builds packages/shared + services/compiler first)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

  # Builds every Dockerfile, brings the full stack up with docker-compose
  # (Postgres included), and runs Playwright against the real, composed
  # production build — nothing here is mocked. Only runs once `test` passes,
  # so a broken lint/typecheck/unit-test never wastes a Docker build.
  e2e:
    name: Build Docker images + e2e against docker-compose
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (for the Playwright CLI)
        run: npm ci

      - name: Create the docker-compose .env
        run: cp .env.example .env

      - name: Build all service images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d
        env:
          # Optional: set an ANTHROPIC_API_KEY repo secret to also exercise
          # /api/ai/* for real. The e2e suite doesn't depend on it either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for the gateway to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "Gateway is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway never became healthy" >&2
          docker compose logs
          exit 1

      - name: Run Playwright e2e tests
        working-directory: apps/web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
