# Render Blueprint — deploys the backend (gateway + services + Postgres).
# The frontend lives in its own repo and deploys to Vercel separately.
#
# Usage: push this repo to GitHub/GitLab, then in the Render dashboard
# choose "New > Blueprint" and point it at the repo. Full walkthrough in
# docs/deploy-render.md. CORS_ORIGIN below assumes the frontend's Vercel
# URL — update it (and push) if that URL ever changes.
#
# All 4 services are `type: web` (Render's Private Services feature —
# which the original design used for compiler/projects/ai-assist — isn't
# available on every workspace plan). Because `projects` may be reached
# directly instead of only through the gateway, it verifies the JWT itself
# rather than trusting a gateway-set header — see
# docs/adr/0007-public-services-with-self-verified-auth.md and
# docs/security.md. compiler/ai-assist hold no user data, so making them
# public carries no equivalent risk.
databases:
  - name: compiler-img-postgres
    databaseName: compiler_img
    user: compiler_img
    plan: free

envVarGroups:
  - name: compiler-img-shared-secrets
    envVars:
      # Shared by gateway (verifies) and projects (issues *and* verifies —
      # see ADR 0007) — must be the exact same value, hence a group instead
      # of two independent generateValue: true (which would produce two
      # different secrets).
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: compiler-img-compiler
    runtime: docker
    dockerfilePath: ./services/compiler/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4001
      - key: HOST
        value: 0.0.0.0

  - type: web
    name: compiler-img-projects
    runtime: docker
    dockerfilePath: ./services/projects/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: compiler-img-shared-secrets
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4003
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: compiler-img-postgres
          property: connectionString

  - type: web
    name: compiler-img-ai-assist
    runtime: docker
    dockerfilePath: ./services/ai-assist/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4004
      - key: HOST
        value: 0.0.0.0
      - key: ANTHROPIC_API_KEY
        sync: false # fill in manually in the Render dashboard
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_MAX_TOKENS
        value: 1024

  - type: web
    name: compiler-img-gateway
    runtime: docker
    dockerfilePath: ./apps/gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: compiler-img-shared-secrets
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: RATE_LIMIT_MAX
        value: 100
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      # Render documents a bare-hostname internal address for every
      # web/private service, but it did not resolve from `type: web`
      # services on this plan in practice (verified: gateway -> compiler
      # failed with "fetch failed" even with the env var correctly set and
      # both services individually healthy) — see
      # docs/adr/0011-gateway-calls-upstreams-by-public-url.md. Using each
      # service's own public HTTPS URL instead, same convention-based
      # caveat as GATEWAY_URL/CORS_ORIGIN below: only correct if the name
      # wasn't already taken by another Render account.
      - key: COMPILER_SERVICE_URL
        value: https://compiler-img-compiler.onrender.com
      - key: PROJECTS_SERVICE_URL
        value: https://compiler-img-projects.onrender.com
      - key: AI_SERVICE_URL
        value: https://compiler-img-ai-assist.onrender.com
      # The frontend's real deployed URL (Vercel) — update here (and push)
      # if it ever changes, instead of editing the dashboard by hand.
      - key: CORS_ORIGIN
        value: https://dslcompiler-web.vercel.app

